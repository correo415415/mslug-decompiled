[package]
name = "mslug"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Metal Slug (Neo Geo, 1996) — port 1:1 a Rust sobre hardware Neo Geo emulado"

[dependencies]
neogeo-hw = { path = "../neogeo-hw" }
mslug-code = { path = "../mslug-code" }
mslug-bridge = { path = "../bridge" }
mslug-game = { path = "../game" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
