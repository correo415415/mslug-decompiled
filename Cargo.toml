[workspace]
resolver = "2"
members = ["crates/neogeo-hw", "crates/game", "crates/gen/*", "crates/mslug-code", "crates/mslug", "crates/mslug-sdl"]
default-members = ["crates/neogeo-hw", "crates/game", "crates/gen/*", "crates/mslug-code", "crates/mslug"]

[profile.release]
opt-level = 3
lto = false
codegen-units = 1

[profile.dev]
opt-level = 1

# El código generado (decenas de miles de funciones pequeñas, repartidas en
# crates/gen/NN para que cada rustc quepa en ~1 GB) se compila con menos
# optimización; el resto, -O3. El bloque de abajo lo reescribe el recompilador.

# >>> GENERADO por tools/recomp/m68k_recomp.py
[profile.release.package.mslug-gen-00]
